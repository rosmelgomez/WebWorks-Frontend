<section class="ww ww-page ww-form-page">
  <header class="ww-page-header"><h1 class="ww-page-title">Actualizar Datos</h1></header>
  <p class="ww-state" role="status" *ngIf="isLoading">Cargando datos...</p><p class="ww-state" role="alert" *ngIf="loadError">{{loadError}}</p>
  <form [formGroup]="updateProfileForm" autocomplete="off" class="ww-form" (ngSubmit)="update()" *ngIf="!isLoading && !loadError">
    <fieldset class="ww-lane">
      <div class="ww-commit"><h2 class="ww-commit-title">Imagen</h2><div class="photo-field"><img class="ww-photo-preview" [src]="urlPhoto" alt=""><label class="ww-action" for="archivo">Elige una imagen</label><input class="file-input" type="file" (change)="captureImage($event)" id="archivo"></div></div>
      <div class="ww-commit" [class.is-done]="updateProfileForm.get('name')?.valid && updateProfileForm.get('lastname')?.valid">
        <h2 class="ww-commit-title">Datos personales</h2><div class="ww-row"><label class="ww-field"><span class="ww-label">Name</span><input class="ww-input" type="text" placeholder="name" formControlName="name" required></label><label class="ww-field"><span class="ww-label">LastName</span><input class="ww-input" type="text" placeholder="lastname" formControlName="lastname" required></label></div>
        <div class="ww-row"><label class="ww-field"><span class="ww-label">Phone</span><input class="ww-input" type="text" placeholder="Phone number" formControlName="phone" required></label><label class="ww-field"><span class="ww-label">Fecha Nacimiento</span><input class="ww-input" type="date" formControlName="birthDate"><span class="ww-hint">MM/DD/YYYY</span></label></div>
      </div>
      <div class="ww-commit" [class.is-done]="updateProfileForm.get('email')?.valid && updateProfileForm.get('username')?.valid"><h2 class="ww-commit-title">Cuenta</h2><label class="ww-field"><span class="ww-label">Email</span><input class="ww-input" type="email" placeholder="email@" formControlName="email" required></label><label class="ww-field"><span class="ww-label">Username</span><input class="ww-input" type="text" placeholder="username" formControlName="username" required></label></div>
      <div class="ww-commit" [class.is-done]="updateProfileForm.get('newPassword')?.valid && updateProfileForm.get('password')?.valid"><h2 class="ww-commit-title">Contraseñas</h2>
        <label class="ww-field"><span class="ww-label">New Password</span><span class="ww-password"><input class="ww-input" [type]="hideNewPassword() ? 'password' : 'text'" placeholder="newPassword" formControlName="newPassword" required><button class="ww-reveal" type="button" (click)="clickEventNewPassword($event)" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hideNewPassword()"><span aria-hidden="true">◉</span></button></span></label>
        <label class="ww-field"><span class="ww-label">Password</span><span class="ww-password"><input class="ww-input" [type]="hide() ? 'password' : 'text'" placeholder="password" formControlName="password" required><button class="ww-reveal" type="button" (click)="clickEvent($event)" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide()"><span aria-hidden="true">◉</span></button></span></label>
      </div>
    </fieldset>
    <div class="ww-form-actions"><button class="ww-button ww-button-dev" type="submit">Update</button></div>
  </form>
</section>
