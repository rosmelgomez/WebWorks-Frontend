<aside class="ww rail">
  <a class="brand" routerLink="/pageUser" aria-label="WebWorks, inicio del developer">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path class="lane-dev" d="M8 3 V14 C8 21 16 21 16 27" />
      <path class="lane-co" d="M24 3 V14 C24 21 16 21 16 27" />
      <circle class="node" cx="16" cy="27" r="4" />
    </svg>
    <span class="brand-name">WebWorks</span>
  </a>

  <nav class="lane" aria-label="Área del developer">
    <ul>
      @for (item of items; track item.route) {
        <li>
          <a class="stop" [routerLink]="item.route" routerLinkActive="is-active"
             ariaCurrentWhenActive="page">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>

  <button type="button" class="logout" (click)="logoutUser()">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4 H4 V16 H8 M12 6 L16 10 L12 14 M16 10 H8" /></svg>
    Salir
  </button>
</aside>
