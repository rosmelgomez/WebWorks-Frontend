<section class="ww ww-page ww-form-page">
  <header class="ww-page-header">
    <div>
      <h1 class="ww-page-title">Agregar Tarjeta</h1>
    </div>
  </header>

  <p class="ww-state" role="status" *ngIf="isLoading">Cargando método de pago...</p>
  <p class="ww-state" role="alert" *ngIf="loadError">{{loadError}}</p>
  <section class="payment-preview" *ngIf="!isLoading && !loadError" aria-label="Vista previa de la tarjeta">
    <p class="preview-number">{{cardForm.get('numberCard')!.value}}</p>
    <dl><div><dt>CARD HPLDER</dt><dd>{{nameUser}}</dd></div><div><dt>VALID TILL</dt><dd>{{cardForm.get('dateCard')!.value | date:'MM/yyyy'}}</dd></div><div><dt>CVV</dt><dd>{{cardForm.get('cvv')!.value}}</dd></div></dl>
  </section>
  <form class="ww-form" [formGroup]="cardForm" (ngSubmit)="addOrUpdateCard()" *ngIf="!isLoading && !loadError">
    <fieldset class="ww-lane">
      <div class="ww-commit" [class.is-done]="cardForm.get('numberCard')?.valid">
        <h2 class="ww-commit-title">Numero de Tarjeta</h2>
        <label class="ww-field">
          <span class="ww-label">Numero de Tarjeta</span>
          <input class="ww-input" type="text" placeholder="numberCard" formControlName="numberCard" maxlength="16" required>
        </label>
      </div>

      <div class="ww-commit" [class.is-done]="cardForm.get('cvv')?.valid && cardForm.get('dateCard')?.valid">
        <h2 class="ww-commit-title">Datos de seguridad</h2>
        <div class="ww-row">
          <label class="ww-field">
            <span class="ww-label">CVV</span>
            <input class="ww-input" type="text" placeholder="cvv" formControlName="cvv" maxlength="3" required
              (focus)="onCardFocus()" (blur)="onCardBlur()" (mouseover)="onCardMouseOver()" (mouseout)="onCardMouseOut()">
          </label>
          <label class="ww-field">
            <span class="ww-label">Fecha de caducidad</span>
            <input class="ww-input" type="date" formControlName="dateCard" required>
            <span class="ww-hint">MM/YYYY</span>
          </label>
        </div>
      </div>
    </fieldset>

    <div class="ww-form-actions">
      <button class="ww-button ww-button-dev" type="submit" *ngIf="!confirm">agregar método de pago</button>
      <button class="ww-button ww-button-dev" type="submit" *ngIf="confirm">modificar método de pago</button>
      <button class="ww-button ww-button-outline" type="button" (click)="deleteMethodPayment()" *ngIf="confirm">eliminar método de pago</button>
      <a class="ww-button ww-button-outline" routerLink="/listMethodPayment" (click)="deleteIdMethodPayment()">ver métodos de pago</a>
    </div>
  </form>
</section>
