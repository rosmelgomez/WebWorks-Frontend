<section class="ww ww-page">
  <header class="ww-page-header"><h1 class="ww-page-title">Profile User</h1><a class="ww-button ww-button-dev" routerLink="/updateProfile">Update</a></header>
  <p class="ww-state" role="status" *ngIf="isLoading">Cargando perfil...</p><p class="ww-state" role="alert" *ngIf="loadError">{{loadError}}</p><p class="ww-state" *ngIf="!isLoading && !loadError && dataSource.data.length === 0">No hay información de perfil.</p>
  <article class="ww-profile" *ngFor="let item of dataSource.data"><dl class="ww-details"><div><dt>Name:</dt><dd>{{item.name}}</dd></div><div><dt>LastName:</dt><dd>{{item.lastname}}</dd></div><div><dt>Birth Date:</dt><dd>{{item.birthDate | date:'dd/MM/yyyy'}}</dd></div><div><dt>Phone:</dt><dd>{{item.phone}}</dd></div><div><dt>Email:</dt><dd>{{item.email}}</dd></div><div><dt>Username:</dt><dd>{{item.username}}</dd></div></dl><img *ngIf="item.photo" [ngSrc]="item.photo.toString()" alt="" width="200" height="200"></article>
</section>
