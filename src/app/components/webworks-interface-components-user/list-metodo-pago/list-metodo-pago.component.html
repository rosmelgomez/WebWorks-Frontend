<section class="ww ww-page">
  <header class="ww-page-header">
    <h1 class="ww-page-title">Métodos de pago</h1>
    <button class="ww-button ww-button-dev" type="button" (click)="newCard()">Agregar Método de Pago</button>
  </header>
  <p class="ww-state" role="status" *ngIf="isLoading">Cargando métodos de pago...</p>
  <p class="ww-state" role="alert" *ngIf="loadError">{{loadError}}</p>
  <p class="ww-state" *ngIf="!isLoading && !loadError && dataSource.data.length === 0">No hay métodos de pago registrados.</p>
  <ol class="ww-log" *ngIf="!isLoading && !loadError && dataSource.data.length > 0">
    <li class="ww-log-item" *ngFor="let item of dataSource.data">
      <button class="payment-row" type="button" (click)="saveData(item.id)">
        <span class="ww-log-title">Visa · {{item.numberCard.slice(0, 4)}} {{item.numberCard.slice(4, 8)}} {{item.numberCard.slice(8, 12)}} {{item.numberCard.slice(12, 16)}}</span>
        <span class="ww-log-meta">CARD HOLDER · {{NameUser}} · VALID TILL {{item.dateCard | date:'MM/yyyy'}} · CVV {{item.cvv}}</span>
      </button>
    </li>
  </ol>
</section>
