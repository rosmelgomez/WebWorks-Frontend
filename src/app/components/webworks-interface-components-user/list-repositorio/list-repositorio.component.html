<section class="ww ww-page">
  <header class="ww-page-header"><h1 class="ww-page-title">LISTA DE REPOSITORIOS</h1><button class="ww-button ww-button-dev" type="button" (click)="deleteDateSave()">Agrege Repositorios</button></header>
  <p class="ww-state" role="status" *ngIf="isLoading">Cargando repositorios...</p>
  <p class="ww-state" role="alert" *ngIf="loadError">{{loadError}}</p>
  <p class="ww-state" *ngIf="!isLoading && !loadError && dataSource.data.length === 0">No hay repositorios registrados.</p>
  <table class="ww-data-table" *ngIf="!isLoading && !loadError && dataSource.data.length > 0">
    <thead><tr><th>Name</th><th>Descripcion</th><th>Fecha de publicacion</th><th>Proyectos</th><th>Actions</th></tr></thead>
    <tbody><tr *ngFor="let element of dataSource.data">
      <td data-label="Name">{{element.name}}</td><td data-label="Descripcion">{{element.description}}</td><td data-label="Fecha de publicacion">{{element.dateCreate | date:'dd/MM/yyyy'}}</td><td data-label="Proyectos">{{element.numberProject}}</td>
      <td data-label="Actions"><div class="ww-table-actions"><a class="ww-action role-dev" title="Esta accion edita el repositorio" routerLink="/agregarRepositorio" (click)="saveDate(element.id, element.name.toString(), element.numberProject)">Edit</a><button class="ww-action" title="Esta accion elimina el repositorio" type="button" (click)="delete(element.id)">Delete</button><a class="ww-action role-dev" title="Agregar proyecto al repositorio" routerLink="/listProyecto" (click)="saveDate(element.id, element.name.toString(), element.numberProject)">Proyectos</a></div></td>
    </tr></tbody>
  </table>
  <div id="chart" class="chart" aria-label="Repositorios con respecto a su cantidad de proyectos"></div>
</section>
