<header class="ww nav" [class.is-open]="menuOpen()">
  <a class="brand" routerLink="/pageInicio" (click)="closeMenu()" aria-label="WebWorks, inicio">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path class="lane-dev" d="M8 3 V14 C8 21 16 21 16 27" />
      <path class="lane-co" d="M24 3 V14 C24 21 16 21 16 27" />
      <circle class="node" cx="16" cy="27" r="4" />
    </svg>
    <span>WebWorks</span>
  </a>

  <button class="menu-toggle" type="button" (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()" aria-controls="nav-publica">
    <span class="sr-only">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      @if (menuOpen()) {
        <path d="M5 5 L19 19 M19 5 L5 19" />
      } @else {
        <path d="M4 7 H20 M4 12 H20 M4 17 H20" />
      }
    </svg>
  </button>

  <nav id="nav-publica" class="links" aria-label="Navegación principal">
    <button type="button" class="link" (click)="goToHowItWorks()">Cómo funciona</button>
    <a class="link" routerLink="/listPlanInicio" routerLinkActive="is-active" (click)="closeMenu()">Planes</a>
    <a class="link" routerLink="/login" routerLinkActive="is-active" (click)="closeMenu()">Iniciar sesión</a>
    <a class="cta" routerLink="/registrar" (click)="closeMenu()">Crear cuenta</a>
  </nav>
</header>
