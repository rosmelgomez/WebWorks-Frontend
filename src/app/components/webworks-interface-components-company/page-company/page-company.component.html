<section class="ww ww-page ww-co-surface">
  <label class="ww-field search"><span class="ww-label">Buscar Informacion</span><input class="ww-input" type="search" placeholder="Buscar Informacion"></label>
  <p class="ww-state" role="status" *ngIf="isLoading">Cargando empresa...</p><p class="ww-state" role="alert" *ngIf="loadError">{{loadError}}</p><p class="ww-state" *ngIf="!isLoading && !loadError && dataSource.data.length === 0">No hay información de la empresa.</p>
  <header class="ww-page-header" *ngFor="let item of dataSource.data"><div><h1 class="ww-page-title">Bienvenido</h1><p class="company-name">{{item.socialReason}}</p></div></header>
  <div class="dashboard-lanes">
    <section class="dashboard-lane"><span class="dashboard-node" aria-hidden="true"></span><h2>Employments</h2><p>Add and See your Employments</p><a class="ww-button ww-button-co" routerLink="/listEmployment">Employment</a></section>
    <section class="dashboard-lane"><span class="dashboard-node" aria-hidden="true"></span><h2>Candidates</h2><p>see candidates</p><a class="ww-button ww-button-co" routerLink="/listJobApplication">Candidates</a></section>
  </div>
</section>
